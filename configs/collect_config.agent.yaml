# MenteE Code 3B - LIVE collection config (agent loop against a real LLM)
#
# This is the config that actually generates trajectories:
#   task -> agent loop (model proposes, runtime executes tools in the repo)
#        -> 13 validation checks -> sandbox spot-check -> append
#
# Keys come from the environment or datasets/collectors/<you>/.env - never hardcode.

collector:
  id: ""                        # set by --collector on the command line
  output_root: datasets/collectors

source:
  kind: agent

  tasks_path: data/tasks/prepared.jsonl

  agent:
    # OpenRouter free tier:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: nvidia/nemotron-3-ultra-550b-a55b:free  # verified: fixed the seed bug end-to-end
    # alternatives verified working:
    #   nvidia/nemotron-3-ultra-550b-a55b:free
    # DeepSeek direct (see docs for the ToS that permits model training):
    #   base_url: https://api.deepseek.com
    #   api_key_env: DEEPSEEK_API_KEY
    #   model: deepseek-flash
    max_turns: 20
    # how many accepted trajectories to collect per task. The same bug is
    # sampled several times (different model sampling) and only the attempts
    # that actually solve it are kept - this is what turns 4 tasks into a
    # usable training set.
    samples_per_task: 10

  teacher:
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    revision: free
    license: NVIDIA-Open-Model-License  # verified: commercial use + derivative models permitted
    sampling:
      temperature: 0.7
      top_p: 0.95

  generator:
    source_id: mente_synth_v1
    source_url: https://openrouter.ai/api/v1
    license: NVIDIA-Open-Model-License
    license_verified: true
    redistributable: true
    trainable: true
    collected_by: ""
    code_version: ""
    prompt_template: mente_agent_v1

  tool_schema_shuffle:
    enabled: true
    probability: 0.35
    rename_probability: 0.8
    rename_params_probability: 0.7
    drop_probability: 0.25
    add_probability: 0.35

output:
  path: datasets/collectors/single/train.jsonl
  rejected_path: datasets/collectors/single/rejected.jsonl
  fsync_every: 5
  resume: true

validation:
  schema_path: schemas/mentee-trajectory-v1.schema.json
  tier_b_sample_rate: 0.0        # the agent already ran the tests in-loop
  require_verified: false
  min_chars: 400
  max_chars: 400000
  max_identical_tool_calls: 4

integrity:
  enabled: true
  first_check_at: 5
  gaps: [10, 20, 30]
  steady_every: 50
  jitter_ratio: 0.30
  full_rescan_every: 5
  on_failure: abort

budget:
  max_rows: null
  max_minutes: 55                # hard stop before an hour of spend
  max_generation_tokens: null
